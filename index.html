<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sky Ace: Aero-Strike</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js"
            }
        }
    </script>
</head>
<body>
    <!-- Game HUD -->
    <div id="ui-layer">
        <div id="score-box">
            <div class="label">SCORE</div>
            <div id="score">0</div>
        </div>
        
        <div id="health-box">
            <div class="label">HULL INTEGRITY</div>
            <div class="bar-bg"><div id="health-bar"></div></div>
        </div>

        <div id="controls-hint">controls: W,A,S,D or ARROWS | SPACE to Fire</div>
    </div>

    <!-- Menus -->
    <div id="start-screen" class="overlay">
        <div class="card">
            <h1>SKY ACE</h1>
            <p>Intercept aerial targets. Dodge incoming debris.</p>
            <button id="start-btn">ENGAGE THRUSTERS</button>
        </div>
    </div>

    <div id="game-over" class="overlay hidden">
        <div class="card fail">
            <h1>CRITICAL FAILURE</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="retry-btn">RESTART MISSION</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
